name: Publish Shorts to YouTube

on:
  workflow_run:
    workflows:
      - "Test Clip Generation"
    types:
      - completed

  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Test Clip Generation run ID"
        required: true
        type: string

      upload_count:
        description: "Number of Shorts to upload"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "all"

      privacy_status:
        description: "YouTube privacy status"
        required: true
        default: "private"
        type: choice
        options:
          - "private"
          - "unlisted"
          - "public"

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read

    steps:

      # ------------------------------------------------------------
      # Determine source run and publishing mode
      # ------------------------------------------------------------

      - name: Determine publishing source and settings
        run: |
          set -e

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            SOURCE_RUN_ID="${{ github.event.workflow_run.id }}"
            UPLOAD_COUNT="1"
            PRIVACY_STATUS="private"

            echo "Automatic publishing mode"
            echo "Source run ID: $SOURCE_RUN_ID"
            echo "Upload count: $UPLOAD_COUNT"
            echo "Privacy: $PRIVACY_STATUS"

          else
            SOURCE_RUN_ID="${{ inputs.source_run_id }}"
            UPLOAD_COUNT="${{ inputs.upload_count }}"
            PRIVACY_STATUS="${{ inputs.privacy_status }}"

            echo "Manual publishing mode"
            echo "Source run ID: $SOURCE_RUN_ID"
            echo "Upload count: $UPLOAD_COUNT"
            echo "Privacy: $PRIVACY_STATUS"
          fi

          if [ -z "$SOURCE_RUN_ID" ]; then
            echo "ERROR: No source workflow run ID."
            exit 1
          fi

          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "UPLOAD_COUNT=$UPLOAD_COUNT" >> "$GITHUB_ENV"
          echo "PRIVACY_STATUS=$PRIVACY_STATUS" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # Download artifact from the exact generation run
      # ------------------------------------------------------------

      - name: Download final Shorts artifact
        uses: actions/download-artifact@v5
        with:
          name: final-shorts
          path: publish-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}


      # ------------------------------------------------------------
      # Validate artifact
      # ------------------------------------------------------------

      - name: Validate artifact
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "DOWNLOADED ARTIFACT"
          echo "========================================"

          find publish-input -maxdepth 3 -type f -print | sort

          echo ""
          echo "Checking required metadata..."

          if [ ! -f "publish-input/job-result.json" ]; then
            echo ""
            echo "ERROR: job-result.json is missing."
            exit 1
          fi

          echo "job-result.json found."

          echo ""
          echo "Checking Shorts..."

          find publish-input/final-shorts \
            -maxdepth 1 \
            -type f \
            -name 'short_*.mp4' \
            -print \
            | sort -V

          SHORT_COUNT=$(find publish-input/final-shorts \
            -maxdepth 1 \
            -type f \
            -name 'short_*.mp4' \
            | wc -l)

          if [ "$SHORT_COUNT" -eq 0 ]; then
            echo "ERROR: No Shorts were found."
            exit 1
          fi

          echo ""
          echo "Shorts found: $SHORT_COUNT"


      # ------------------------------------------------------------
      # Install libraries
      # ------------------------------------------------------------

      - name: Install API libraries
        run: |
          set -e

          python3 -m pip install --upgrade \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib \
            google-genai


      # ------------------------------------------------------------
      # Upload to YouTube
      # ------------------------------------------------------------

      - name: Upload Shorts to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          from google import genai
          from google.genai import types

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          INPUT_DIR = Path("publish-input/final-shorts")
          JOB_RESULT = Path("publish-input/job-result.json")

          CLIENT_ID = os.environ["YOUTUBE_CLIENT_ID"]
          CLIENT_SECRET = os.environ["YOUTUBE_CLIENT_SECRET"]
          REFRESH_TOKEN = os.environ["YOUTUBE_REFRESH_TOKEN"]
          YOUTUBE_API_KEY = os.environ["YOUTUBE_API_KEY"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          UPLOAD_COUNT = os.environ["UPLOAD_COUNT"]
          PRIVACY_STATUS = os.environ["PRIVACY_STATUS"]


          # ============================================================
          # Load OpenShorts metadata
          # ============================================================

          with JOB_RESULT.open("r", encoding="utf-8") as f:
              job_data = json.load(f)

          clips = (
              job_data.get("result", {}).get("clips", [])
              or []
          )

          if not clips:
              raise SystemExit(
                  "ERROR: job-result.json contains no result.clips."
              )

          print("")
          print("========================================")
          print("OPENSHORTS METADATA")
          print("========================================")
          print(f"Metadata clips: {len(clips)}")


          # ============================================================
          # Find Shorts
          # ============================================================

          pattern = re.compile(r"^short_(\d+)\.mp4$")
          short_files = []

          for path in INPUT_DIR.glob("short_*.mp4"):
              match = pattern.match(path.name)

              if not match:
                  continue

              number = int(match.group(1))
              short_files.append((number, path))

          short_files.sort(key=lambda item: item[0])

          if not short_files:
              raise SystemExit(
                  "ERROR: No short_*.mp4 files were found."
              )


          print("")
          print("Shorts found:")

          for number, path in short_files:
              print(f"  {number}: {path.name}")


          # ============================================================
          # Verify metadata count
          # ============================================================

          if len(clips) != len(short_files):
              raise SystemExit(
                  f"ERROR: Found {len(short_files)} Shorts but "
                  f"{len(clips)} metadata clips. Refusing to publish."
              )


          # ============================================================
          # Select Shorts
          # ============================================================

          if UPLOAD_COUNT == "all":
              selected = short_files
          else:
              count = int(UPLOAD_COUNT)
              selected = short_files[:count]

          print("")
          print(f"Shorts selected: {len(selected)}")


          # ============================================================
          # Create YouTube OAuth credentials
          # ============================================================

          credentials = Credentials(
              token=None,
              refresh_token=REFRESH_TOKEN,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=CLIENT_ID,
              client_secret=CLIENT_SECRET,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ],
          )

          print("")
          print("Refreshing YouTube access token...")

          credentials.refresh(Request())

          print("Access token refreshed successfully.")


          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
          )
          category_youtube = build(
              "youtube",
              "v3",
              developerKey=YOUTUBE_API_KEY,
          )


          # ============================================================
          # Get currently available YouTube categories
          # ============================================================

          print("")
          print("Fetching available YouTube categories...")

          category_response = (
              category_youtube
              .videoCategories()
              .list(
                  part="snippet",
                  regionCode="IN",
                  hl="en_US",
              )
              .execute()
          )

          available_categories = []

          for item in category_response.get("items", []):
              snippet = item.get("snippet", {})

              if not snippet.get("assignable", False):
                  continue

              category_id = str(item.get("id", "")).strip()
              category_title = str(
                  snippet.get("title", "")
              ).strip()

              if category_id and category_title:
                  available_categories.append({
                      "id": category_id,
                      "title": category_title,
                  })


          if not available_categories:
              raise SystemExit(
                  "ERROR: YouTube returned no assignable categories."
              )


          print("")
          print("Available categories:")

          for category in available_categories:
              print(
                  f"  {category['id']}: "
                  f"{category['title']}"
              )


          # ============================================================
          # Ask Gemini to classify ALL selected Shorts in ONE call
          # ============================================================

          category_payload = []

          for number, _video_path in selected:

              clip_index = number - 1
              clip = clips[clip_index]

              category_payload.append({
                  "short_number": number,
                  "title": (
                      clip.get(
                          "video_title_for_youtube_short"
                      )
                      or clip.get("title")
                      or ""
                  ),
                  "description": (
                      clip.get(
                          "video_description_for_instagram"
                      )
                      or clip.get(
                          "video_description_for_tiktok"
                      )
                      or ""
                  ),
                  "hook": (
                      clip.get("viral_hook_text")
                      or ""
                  ),
              })


          category_names = [
              category["title"]
              for category in available_categories
          ]


          category_prompt = f"""
          You are classifying short-form videos for YouTube.

          Choose the SINGLE most appropriate YouTube video category for EACH Short.

          IMPORTANT:
          - Choose only from the allowed category names below.
          - Do not invent a category.
          - Base the decision on the actual subject of the Short.
          - Ignore the creator/channel identity.
          - Use the closest specific category.
          - Do NOT choose a generic category just because the title is broad.
          - Return exactly one category for every short.

          ALLOWED YOUTUBE CATEGORIES:
          {json.dumps(category_names, ensure_ascii=False)}

          SHORTS:
          {json.dumps(category_payload, ensure_ascii=False, indent=2)}

          Return ONLY valid JSON:

          {{
            "categories": [
              {{
                "short_number": 1,
                "category_title": "Exact category name from allowed list"
              }}
            ]
          }}
          """


          print("")
          print("========================================")
          print("GEMINI YOUTUBE CATEGORY CLASSIFICATION")
          print("========================================")


          gemini = genai.Client(
              api_key=GEMINI_API_KEY
          )


          response = gemini.models.generate_content(
              model="gemini-3.1-flash-lite",
              contents=category_prompt,
              config=types.GenerateContentConfig(
                  response_mime_type="application/json",
                  temperature=0,
              ),
          )


          raw_category_text = (
              response.text or ""
          ).strip()


          if not raw_category_text:
              raise SystemExit(
                  "ERROR: Gemini returned an empty category response."
              )


          try:
              category_result = json.loads(
                  raw_category_text
              )
          except json.JSONDecodeError as exc:
              print("Gemini response:")
              print(raw_category_text)
              raise SystemExit(
                  f"ERROR: Could not parse Gemini category JSON: {exc}"
              )


          category_rows = (
              category_result.get("categories")
              or []
          )


          if len(category_rows) != len(selected):
              raise SystemExit(
                  f"ERROR: Gemini returned "
                  f"{len(category_rows)} categories for "
                  f"{len(selected)} Shorts."
              )


          # ============================================================
          # Build category lookup
          # ============================================================

          category_lookup = {
              category["title"].casefold(): category["id"]
              for category in available_categories
          }

          category_display_lookup = {
              category["title"].casefold(): category["title"]
              for category in available_categories
          }


          selected_numbers = {
              number
              for number, _path in selected
          }


          assigned_categories = {}


          for row in category_rows:

              try:
                  short_number = int(
                      row["short_number"]
                  )
              except (
                  KeyError,
                  TypeError,
                  ValueError,
              ):
                  raise SystemExit(
                      "ERROR: Gemini returned an invalid short_number."
                  )

              if short_number not in selected_numbers:
                  raise SystemExit(
                      f"ERROR: Gemini returned unknown "
                      f"Short {short_number}."
                  )

              category_title = str(
                  row.get("category_title", "")
              ).strip()

              category_key = category_title.casefold()

              if category_key not in category_lookup:
                  raise SystemExit(
                      "ERROR: Gemini returned a category "
                      f"that YouTube did not provide: "
                      f"{category_title}"
                  )

              if short_number in assigned_categories:
                  raise SystemExit(
                      f"ERROR: Gemini assigned Short "
                      f"{short_number} more than once."
                  )

              assigned_categories[short_number] = {
                  "id": category_lookup[category_key],
                  "title": category_display_lookup[category_key],
              }


          if set(assigned_categories) != selected_numbers:
              raise SystemExit(
                  "ERROR: Gemini did not assign exactly one "
                  "category to every selected Short."
              )


          print("")

          for number in sorted(assigned_categories):
              category = assigned_categories[number]

              print(
                  f"Short {number:02d} → "
                  f"{category['title']} "
                  f"(YouTube ID {category['id']})"
              )


          # ============================================================
          # Upload Shorts
          # ============================================================

          for number, video_path in selected:

              clip_index = number - 1
              clip = clips[clip_index]

              title = (
                  clip.get(
                      "video_title_for_youtube_short"
                  )
                  or clip.get("title")
              )

              description = (
                  clip.get(
                      "video_description_for_instagram"
                  )
                  or clip.get(
                      "video_description_for_tiktok"
                  )
              )

              hook = (
                  clip.get("viral_hook_text")
                  or ""
              )


              if not title:
                  raise SystemExit(
                      f"ERROR: Short {number:02d} has no "
                      "YouTube title metadata."
                  )

              if not description:
                  raise SystemExit(
                      f"ERROR: Short {number:02d} has no "
                      "description metadata."
                  )


              title = str(title).strip()
              description = str(description).strip()
              hook = str(hook).strip()


              # --------------------------------------------------------
              # Build description
              # --------------------------------------------------------

              description_parts = []

              if hook:
                  description_parts.append(hook)

              description_parts.append(description)
              description_parts.append("#Shorts")

              final_description = "\n\n".join(
                  part
                  for part in description_parts
                  if part
              )


              title = title[:100]
              final_description = final_description[:5000]


              category = assigned_categories[number]


              print("")
              print("========================================")
              print(f"UPLOADING SHORT {number:02d}")
              print("========================================")

              print("File:", video_path.name)
              print("Title:", title)
              print(
                  "Category:",
                  category["title"],
                  f"(ID {category['id']})",
              )
              print("Privacy:", PRIVACY_STATUS)

              print("")
              print("Description:")
              print(final_description)


              body = {
                  "snippet": {
                      "title": title,
                      "description": final_description,
                      "categoryId": category["id"],
                  },
                  "status": {
                      "privacyStatus": PRIVACY_STATUS,
                      "selfDeclaredMadeForKids": False,
                  },
              }


              media = MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  resumable=True,
              )


              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media,
              )


              response = request.execute()

              video_id = response["id"]


              print("")
              print("UPLOAD SUCCESSFUL")
              print("Video ID:", video_id)
              print("Title:", title)
              print("Category:", category["title"])
              print("Privacy:", PRIVACY_STATUS)

              print(
                  "URL:",
                  f"https://www.youtube.com/watch?v={video_id}",
              )


          print("")
          print("========================================")
          print("YOUTUBE PUBLISHING COMPLETED")
          print("========================================")
          PY
