name: Publish Shorts to YouTube

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Test Clip Generation run ID"
        required: true
        type: string

      upload_count:
        description: "Number of Shorts to upload"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "all"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read

    steps:
      - name: Download final Shorts artifact
        uses: actions/download-artifact@v5
        with:
          name: final-shorts
          path: publish-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Inspect downloaded files
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "DOWNLOADED ARTIFACT"
          echo "========================================"

          find publish-input -maxdepth 2 -type f -print | sort

          echo ""
          echo "Shorts found:"
          find publish-input -maxdepth 1 -type f -name 'short_*.mp4' -print | sort

      - name: Install YouTube API libraries
        run: |
          set -e

          python3 -m pip install --upgrade \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Upload Shorts to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          UPLOAD_COUNT: ${{ inputs.upload_count }}
        run: |
          set -e

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          INPUT_DIR = Path("publish-input")
          JOB_RESULT = INPUT_DIR / "job-result.json"

          client_id = os.environ["YOUTUBE_CLIENT_ID"]
          client_secret = os.environ["YOUTUBE_CLIENT_SECRET"]
          refresh_token = os.environ["YOUTUBE_REFRESH_TOKEN"]
          upload_count = os.environ["UPLOAD_COUNT"]

          # ------------------------------------------------------------
          # Read OpenShorts metadata when available.
          #
          # Older artifacts may not contain job-result.json because it
          # was added later. In that case we safely fall back to a
          # generic title.
          # ------------------------------------------------------------

          clips = []

          if JOB_RESULT.exists():
              print("Found job-result.json")
              with JOB_RESULT.open("r", encoding="utf-8") as f:
                  job_data = json.load(f)

              clips = (
                  job_data.get("result", {}).get("clips", [])
                  or []
              )

              print(f"Metadata clips found: {len(clips)}")
          else:
              print("job-result.json not found.")
              print("Using fallback titles for this test artifact.")

          # ------------------------------------------------------------
          # Find Shorts in numerical order.
          #
          # short_01.mp4
          # short_02.mp4
          # ...
          # short_10.mp4
          # ------------------------------------------------------------

          short_files = []

          pattern = re.compile(r"^short_(\d+)\.mp4$")

          for path in INPUT_DIR.glob("short_*.mp4"):
              match = pattern.match(path.name)

              if not match:
                  continue

              number = int(match.group(1))
              short_files.append((number, path))

          short_files.sort(key=lambda item: item[0])

          if not short_files:
              raise SystemExit(
                  "No short_*.mp4 files were found in the artifact."
              )

          print("")
          print("Shorts available:")

          for number, path in short_files:
              print(f"  {number}: {path.name}")

          if upload_count == "all":
              selected = short_files
          else:
              count = int(upload_count)
              selected = short_files[:count]

          print("")
          print(f"Shorts selected for upload: {len(selected)}")

          # ------------------------------------------------------------
          # Create YouTube credentials.
          # ------------------------------------------------------------

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ],
          )

          print("")
          print("Refreshing YouTube access token...")

          credentials.refresh(Request())

          print("Access token refreshed successfully.")

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
          )

          # ------------------------------------------------------------
          # Upload selected Shorts.
          #
          # IMPORTANT:
          # The first integration test deliberately uses PRIVATE
          # visibility. Once this works, we'll change it to PUBLIC.
          # ------------------------------------------------------------

          for number, video_path in selected:

              clip_index = number - 1

              clip = {}

              if 0 <= clip_index < len(clips):
                  clip = clips[clip_index] or {}

              title = (
                  clip.get("video_title_for_youtube_short")
                  or clip.get("title")
                  or f"AutoShort2 Short {number:02d}"
              )

              description = (
                  clip.get("video_description_for_instagram")
                  or clip.get("video_description_for_tiktok")
                  or "Short generated by AutoShort2."
              )

              # YouTube title limit.
              title = str(title).strip()[:100]

              # Keep description reasonable.
              description = str(description).strip()[:5000]

              print("")
              print("========================================")
              print(f"UPLOADING SHORT {number:02d}")
              print("========================================")
              print("File:", video_path.name)
              print("Title:", title)
              print("Privacy: private")

              body = {
                  "snippet": {
                      "title": title,
                      "description": description,
                      "categoryId": "22",
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False,
                  },
              }

              media = MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  resumable=True,
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media,
              )

              response = request.execute()

              video_id = response["id"]

              print("")
              print("UPLOAD SUCCESSFUL")
              print("Video ID:", video_id)
              print("Title:", title)
              print("Privacy: private")
              print(
                  "URL:",
                  f"https://www.youtube.com/watch?v={video_id}",
              )

          print("")
          print("========================================")
          print("YOUTUBE PUBLISH TEST COMPLETED")
          print("========================================")
          PY
