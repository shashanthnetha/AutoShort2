name: Test Clip Generation

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL to clip'
        required: true
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare host directories
        run: |
          mkdir -p uploads output
          chmod -R 777 uploads output

      - name: Start backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker compose up --build -d

      - name: Wait for backend to be ready
        run: |
          set -e

          for i in {1..60}; do
            if curl -sf http://localhost:8000/health/ready > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend... ($i/60)"
            sleep 5
          done

          echo "Backend did not become ready"
          docker compose logs backend --tail=200
          exit 1

      - name: Start video processing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -e

          echo "Submitting video to OpenShorts..."
          echo "Video URL: $VIDEO_URL"

          RESPONSE=$(curl -sf -X POST \
            http://localhost:8000/api/process \
            -H "Content-Type: application/json" \
            -H "X-Gemini-Key: $GEMINI_API_KEY" \
            --data "$(jq -n \
              --arg url "$VIDEO_URL" \
              '{url: $url, acknowledged: true}')")

          echo "API response:"
          echo "$RESPONSE" | jq .

          JOB_ID=$(echo "$RESPONSE" | jq -r '.job_id // empty')

          if [ -z "$JOB_ID" ]; then
            echo "No job_id was returned."

            NEEDS_CONFIRMATION=$(echo "$RESPONSE" | jq -r '.needs_confirmation // false')

            if [ "$NEEDS_CONFIRMATION" = "true" ]; then
              echo "OpenShorts requires low-quality confirmation."
              echo "$RESPONSE" | jq .
            fi

            exit 1
          fi

          echo "Job created successfully."
          echo "JOB_ID=$JOB_ID"

          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Wait for video processing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "Waiting for OpenShorts job: $JOB_ID"

          for i in {1..100}; do

            RESPONSE=$(curl -sf \
              -H "X-Gemini-Key: $GEMINI_API_KEY" \
              "http://localhost:8000/api/status/$JOB_ID")

            STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')

            echo ""
            echo "========================================"
            echo "Check $i/100"
            echo "Status: $STATUS"
            echo "========================================"

            LOGS=$(echo "$RESPONSE" | jq -r '.logs[]?')

            if [ -n "$LOGS" ]; then
              echo "$LOGS"
            fi

            if [ "$STATUS" = "completed" ]; then
              echo ""
              echo "========================================"
              echo "PROCESSING COMPLETED"
              echo "========================================"

              echo "$RESPONSE" > job-result.json

              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo ""
              echo "========================================"
              echo "OPENSHORTS JOB FAILED"
              echo "========================================"

              echo "$RESPONSE" | jq .

              exit 1
            fi

            sleep 30
          done

          echo ""
          echo "========================================"
          echo "TIMEOUT WAITING FOR OPENSHORTS"
          echo "========================================"

          exit 1

      - name: Show generated clips
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "GENERATED CLIPS"
          echo "========================================"

          python3 - <<'PY'
          import json

          with open("job-result.json", "r") as f:
              data = json.load(f)

          result = data.get("result", {})
          clips = result.get("clips", [])

          print(f"Job ID: {data.get('job_id', 'unknown')}")
          print(f"Status: {data.get('status', 'unknown')}")
          print(f"Generated clips: {len(clips)}")

          if not clips:
              print("No clips were returned.")
              raise SystemExit(1)

          for i, clip in enumerate(clips):
              print()
              print(f"CLIP {i}")
              print("----------------------------------------")
              print("Title:", clip.get("title"))
              print(
                  "YouTube title:",
                  clip.get("video_title_for_youtube_short")
              )
              print("Start:", clip.get("start"))
              print("End:", clip.get("end"))
              print("Video URL:", clip.get("video_url"))
          PY

      - name: List generated MP4 files
        run: |
          echo ""
          echo "========================================"
          echo "GENERATED MP4 FILES"
          echo "========================================"

          find output -type f -iname "*.mp4" -print 2>/dev/null || true

      - name: Show backend logs
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "BACKEND LOGS"
          echo "========================================"

          docker compose logs backend --tail=300

      - name: Upload generated clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips
          path: |
            output/**/*.mp4
          retention-days: 3
          if-no-files-found: warn
