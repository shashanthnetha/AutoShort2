name: Test YouTube Upload

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Title for the test YouTube video"
        required: true
        default: "AutoShort2 YouTube API Test"
        type: string

jobs:
  upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install FFmpeg
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      - name: Create test video
        env:
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          set -e

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -f lavfi \
            -i "anullsrc=r=44100:cl=stereo" \
            -t 5 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            test-short.mp4

          echo ""
          echo "========================================"
          echo "TEST VIDEO CREATED"
          echo "========================================"

          ls -lh test-short.mp4

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            test-short.mp4

      - name: Install YouTube API libraries
        run: |
          set -e

          python3 -m pip install --upgrade \
            google-api-python-client \
            google-auth \
            google-auth-httplib2 \
            google-auth-oauthlib

      - name: Upload test video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          set -e

          python3 - <<'PY'
          import os

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ["YOUTUBE_CLIENT_ID"]
          client_secret = os.environ["YOUTUBE_CLIENT_SECRET"]
          refresh_token = os.environ["YOUTUBE_REFRESH_TOKEN"]

          credentials = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ],
          )

          print("Refreshing YouTube access token...")

          credentials.refresh(Request())

          print("Access token refreshed successfully.")
          print("Creating YouTube API client...")

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
          )

          title = os.environ["VIDEO_TITLE"]

          body = {
              "snippet": {
                  "title": title,
                  "description": (
                      "Test upload from AutoShort2 "
                      "GitHub Actions."
                  ),
                  "categoryId": "22",
              },
              "status": {
                  "privacyStatus": "private",
                  "selfDeclaredMadeForKids": False,
              },
          }

          media = MediaFileUpload(
              "test-short.mp4",
              mimetype="video/mp4",
              resumable=True,
          )

          print("")
          print("========================================")
          print("UPLOADING TO YOUTUBE")
          print("========================================")

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media,
          )

          response = request.execute()

          video_id = response["id"]

          print("")
          print("========================================")
          print("YOUTUBE UPLOAD SUCCESSFUL")
          print("========================================")
          print("Video ID:", video_id)
          print("Title:", title)
          print("Privacy: private")
          print(
              "URL: https://www.youtube.com/watch?v="
              + video_id
          )
          PY
